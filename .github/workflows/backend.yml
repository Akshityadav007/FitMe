name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitme
          POSTGRES_USER: fitme
          POSTGRES_PASSWORD: fitme_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitme -d fitme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        env:
          FITME_DATABASE_URL: postgresql+asyncpg://fitme:fitme_password@localhost:5432/fitme
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check app tests
