services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitme}
      POSTGRES_USER: ${POSTGRES_USER:-fitme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitme_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitme} -d ${POSTGRES_DB:-fitme}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
